# Answer key for depscan-heldout-3 (Django "fieldnotes" site).
# Advisory set = every distinct OSV advisory for every pin in requirements.txt and requirements-dev.txt
# (checked with heldout-kit/osv_query.py on 2026-09-27): django 6.0.6 x4, markdown 3.7 x1,
# bleach 6.2.0 x2, pyyaml 5.3.1 x1 = 8. All other pins return 0.
advisories:
  - id: CVE-2026-48588
    package: django
    expected: uncertain
    scenario: reachable_via_framework
    reason: "Pre-registered as uncertain (was likely_affected): UpdateCacheMiddleware only skipped caching cookie-setting, Vary: Cookie responses when the request had no cookies at all. The site enables per-site caching (UpdateCacheMiddleware/FetchFromCacheMiddleware) and every page renders {% csrf_token %} (theme form in base.html), so responses set the CSRF cookie with Vary: Cookie; visitors carrying the unrelated fieldnotes_theme cookie get those responses stored in the shared DatabaseCache. Uncertain because the cached response is keyed on the full Cookie header, so another client only receives it when sending an identical Cookie header, which limits real exposure."
    key_location: fieldnotes/settings.py:21
  - id: CVE-2026-53878
    package: django
    expected: uncertain
    scenario: safe_arguments
    reason: "Pre-registered as uncertain (was likely_not_affected): DomainNameValidator accepts a trailing newline, which matters only when values bypass form fields and reach a raw HTTP header. Source.domain is only ever set through SourceForm / the admin ModelForm (forms.CharField strips surrounding whitespace, the case Django itself says is unaffected), and the value is only rendered into HTML links, never into a response header. Uncertain because forms.CharField strips only leading/trailing whitespace rather than all newlines, so the not-affected call rests on the trigger being a trailing newline plus the value never reaching a header."
    key_location: notes/models.py:21
  - id: CVE-2026-53877
    package: django
    expected: likely_not_affected
    scenario: framework_dependency_unused_api
    reason: "Heap over-read in django.contrib.gis.gdal.GDALRaster built from bytes. GeoDjango is not in INSTALLED_APPS, nothing imports django.contrib.gis, and the database is plain SQLite."
    key_location: fieldnotes/settings.py:10
  - id: CVE-2026-15830
    package: django
    expected: likely_not_affected
    scenario: framework_dependency_unused_api
    reason: "Unbounded recursion in django.contrib.gis.geos.GEOSGeometry / GeometryField parsing nested GEOMETRYCOLLECTION. No GeoDjango app, geometry field, form field or GEOS import exists in the project."
    key_location: fieldnotes/settings.py:10
  - id: CVE-2025-69534
    package: markdown
    expected: likely_affected
    scenario: reachable_untrusted_input
    reason: "Malformed '<![' raw-HTML sequences make Python-Markdown raise an uncaught exception on Python < 3.13 (fixed in CPython 3.13, worked around in Markdown 3.8.1). render_markdown() calls markdown.markdown() on member-written note bodies and on arbitrary text POSTed to /preview/; the project targets Python 3.12."
    key_location: notes/rendering.py:22
  - id: GHSA-8rfp-98v4-mmr6
    package: bleach
    expected: uncertain
    scenario: reachable_untrusted_input
    reason: "Pre-registered as uncertain (was likely_affected): bleach.clean lets through javascript URIs obfuscated with Unicode > U+00A0 when 'a' is an allowed tag and 'href' an allowed attribute. render_markdown() cleans member-supplied HTML with ALLOWED_TAGS containing 'a' and ALLOWED_ATTRIBUTES {'a': ['href', 'title']}, so the protocol allowlist can be bypassed (browser impact limited, per advisory). Uncertain because the advisory itself says browsers do not execute these Unicode-obfuscated URIs, so the precondition is met but practical impact is doubtful."
    key_location: notes/rendering.py:23
  - id: GHSA-gj48-438w-jh9v
    package: bleach
    expected: likely_not_affected
    scenario: safe_arguments
    reason: "The gap is that formaction values are not protocol-checked, which only matters if the caller allows the formaction attribute (on button/input). The app's allowlist has no button/input tags and no formaction attribute, so bleach strips it."
    key_location: notes/rendering.py:11
  - id: CVE-2020-14343
    package: pyyaml
    expected: likely_not_affected
    scenario: test_only
    reason: "Code execution via yaml.full_load / FullLoader on attacker-controlled YAML. The only yaml.load(..., Loader=yaml.FullLoader) call is in the test suite, reading the repository's own fixtures/demo.yaml; PyYAML is only in requirements-dev.txt and never imported by application code."
    key_location: notes/tests/test_fixtures.py:14

